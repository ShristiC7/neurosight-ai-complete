---
# ============================================================
# NeuroSight AI — Backend Kubernetes Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurosight-backend
  namespace: neurosight-prod
  labels:
    app: neurosight-backend
    component: api
    version: "1.0.0"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: neurosight-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: neurosight-backend
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: neurosight-backend

      # Anti-affinity: spread across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: neurosight-backend

      containers:
        - name: backend
          image: ghcr.io/neurosight/neurosight-ai-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: ENVIRONMENT
              value: "production"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: neurosight-secrets
                  key: secret-key
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: neurosight-secrets
                  key: jwt-secret-key
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: neurosight-db-secret
                  key: host
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neurosight-db-secret
                  key: password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: neurosight-config
                  key: redis-host
            - name: QDRANT_HOST
              valueFrom:
                configMapKeyRef:
                  name: neurosight-config
                  key: qdrant-host

          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12

          volumeMounts:
            - name: ml-models
              mountPath: /app/ml-models
              readOnly: true

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

      volumes:
        - name: ml-models
          persistentVolumeClaim:
            claimName: ml-models-pvc

      imagePullSecrets:
        - name: ghcr-secret

---
# ============================================================
# Backend Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: neurosight-backend
  namespace: neurosight-prod
  labels:
    app: neurosight-backend
spec:
  selector:
    app: neurosight-backend
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
# ============================================================
# Horizontal Pod Autoscaler — Backend
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neurosight-backend-hpa
  namespace: neurosight-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neurosight-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ============================================================
# Frontend Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurosight-frontend
  namespace: neurosight-prod
  labels:
    app: neurosight-frontend
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neurosight-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: neurosight-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/neurosight/neurosight-ai-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: neurosight-config
                  key: api-url
            - name: NEXT_PUBLIC_WS_URL
              valueFrom:
                configMapKeyRef:
                  name: neurosight-config
                  key: ws-url

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: neurosight-frontend
  namespace: neurosight-prod
spec:
  selector:
    app: neurosight-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP

---
# ============================================================
# Ingress with TLS
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neurosight-ingress
  namespace: neurosight-prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - neurosight.ai
        - api.neurosight.ai
      secretName: neurosight-tls
  rules:
    - host: neurosight.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neurosight-frontend
                port:
                  number: 3000
    - host: api.neurosight.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neurosight-backend
                port:
                  number: 8000

---
# ============================================================
# ConfigMap
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: neurosight-config
  namespace: neurosight-prod
data:
  api-url: "https://api.neurosight.ai"
  ws-url: "wss://api.neurosight.ai/ws"
  redis-host: "redis-master.neurosight-prod.svc.cluster.local"
  qdrant-host: "qdrant.neurosight-prod.svc.cluster.local"

---
# ============================================================
# Celery Worker Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurosight-celery-worker
  namespace: neurosight-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neurosight-celery-worker
  template:
    metadata:
      labels:
        app: neurosight-celery-worker
    spec:
      containers:
        - name: celery-worker
          image: ghcr.io/neurosight/neurosight-ai-backend:latest
          command:
            - celery
            - -A
            - app.core.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
            - --queues=ml_inference,recommendations,notifications
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: neurosight-secrets
                  key: secret-key
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: neurosight-db-secret
                  key: host
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neurosight-db-secret
                  key: password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: neurosight-config
                  key: redis-host
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "6Gi"
          volumeMounts:
            - name: ml-models
              mountPath: /app/ml-models
              readOnly: true
      volumes:
        - name: ml-models
          persistentVolumeClaim:
            claimName: ml-models-pvc
