name: neurosight-ai

# ============================================================
# NeuroSight AI — Full Stack Docker Compose
# Development + staging configuration
# ============================================================

services:

  # --------------------------------------------------------
  # Frontend — Next.js 15
  # --------------------------------------------------------
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend
      target: development
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - NODE_ENV=development
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - neurosight-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # --------------------------------------------------------
  # Backend — FastAPI
  # --------------------------------------------------------
  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
      target: development
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - SECRET_KEY=dev-secret-key-change-in-production-minimum-32-chars
      - JWT_SECRET_KEY=dev-jwt-secret-change-in-production-minimum-32-chars
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=neurosight
      - POSTGRES_USER=neurosight
      - POSTGRES_PASSWORD=neurosight_dev_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ALLOWED_ORIGINS=["http://localhost:3000"]
      - DEBUG=true
    volumes:
      - ../../backend:/app
      - ../../ml-models:/app/ml-models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - neurosight-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # Celery Worker — Background ML Tasks
  # --------------------------------------------------------
  celery-worker:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
      target: development
    command: >
      celery -A app.core.celery_app worker --loglevel=info --concurrency=4 --queues=ml_inference,recommendations,notifications
    environment:
      - ENVIRONMENT=development
      - SECRET_KEY=dev-secret-key-change-in-production-minimum-32-chars
      - JWT_SECRET_KEY=dev-jwt-secret-change-in-production-minimum-32-chars
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=neurosight_dev_password
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ../../backend:/app
      - ../../ml-models:/app/ml-models:ro
    depends_on:
      - backend
      - redis
    networks:
      - neurosight-net
    restart: unless-stopped

  # --------------------------------------------------------
  # Celery Beat — Scheduled Tasks
  # --------------------------------------------------------
  celery-beat:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
      target: development
    command: >
      celery -A app.core.celery_app beat --loglevel=info --scheduler=celery.schedulers:PersistentScheduler
    environment:
      - ENVIRONMENT=development
      - SECRET_KEY=dev-secret-key-change-in-production-minimum-32-chars
      - POSTGRES_HOST=postgres
      - POSTGRES_PASSWORD=neurosight_dev_password
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ../../backend:/app
    depends_on:
      - redis
    networks:
      - neurosight-net
    restart: unless-stopped

  # --------------------------------------------------------
  # Flower — Celery Monitoring UI
  # --------------------------------------------------------
  flower:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
      target: development
    command: >
      celery -A app.core.celery_app flower --port=5555 --basic_auth=admin:neurosight_flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - redis
    networks:
      - neurosight-net
    restart: unless-stopped

  # --------------------------------------------------------
  # PostgreSQL 17
  # --------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=neurosight
      - POSTGRES_USER=neurosight
      - POSTGRES_PASSWORD=8_RRBahGkFTZR_tdH8Ly8j8SnmM
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - neurosight-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U neurosight -d neurosight" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=768MB -c work_mem=4MB -c maintenance_work_mem=64MB -c wal_level=replica -c synchronous_commit=off

  # --------------------------------------------------------
  # Redis 7 — Cache + Message Broker
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000
    volumes:
      - redis-data:/data
    networks:
      - neurosight-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # --------------------------------------------------------
  # Qdrant — Vector Database
  # --------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.14.0
    ports:
      - "6333:6333"
      - "6334:6334" # gRPC
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - neurosight-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/healthz" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------
  # Prometheus — Metrics Collection
  # --------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.4.1
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - neurosight-net
    restart: unless-stopped

  # --------------------------------------------------------
  # Grafana — Metrics Dashboard
  # --------------------------------------------------------
  grafana:
    image: grafana/grafana:12.0.1
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=neurosight_grafana
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - neurosight-net
    restart: unless-stopped

  # --------------------------------------------------------
  # pgAdmin — DB Management (dev only)
  # --------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:9
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@neurosight.ai
      - PGADMIN_DEFAULT_PASSWORD=neurosight_admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - neurosight-net
    profiles:
      - debug

# ============================================================
# Networks
# ============================================================
networks:
  neurosight-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  prometheus-data:
  grafana-data:
  pgadmin-data:
