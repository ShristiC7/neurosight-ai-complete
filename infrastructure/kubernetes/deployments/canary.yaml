# ============================================================
# NeuroSight AI — Backend Kubernetes Canary Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurosight-backend-canary
  namespace: neurosight-prod
  labels:
    app: neurosight-backend-canary
    component: api
    version: "1.1.0-canary"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: neurosight-backend-canary
  template:
    metadata:
      labels:
        app: neurosight-backend-canary
        component: api
        version: "1.1.0-canary"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: neurosight-backend

      containers:
        - name: backend
          image: ghcr.io/neurosight/neurosight-ai-backend:v1.1.0-canary
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: ENVIRONMENT
              value: "production"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: neurosight-secrets
                  key: secret-key
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: neurosight-secrets
                  key: jwt-secret-key
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: neurosight-db-secret
                  key: host
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: neurosight-db-secret
                  key: password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: neurosight-config
                  key: redis-host
            - name: QDRANT_HOST
              valueFrom:
                configMapKeyRef:
                  name: neurosight-config
                  key: qdrant-host

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12

          volumeMounts:
            - name: ml-models
              mountPath: /app/ml-models
              readOnly: true

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

      volumes:
        - name: ml-models
          persistentVolumeClaim:
            claimName: ml-models-pvc

      imagePullSecrets:
        - name: ghcr-secret

---
# ============================================================
# Canary Backend Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: neurosight-backend-canary
  namespace: neurosight-prod
  labels:
    app: neurosight-backend-canary
spec:
  selector:
    app: neurosight-backend-canary
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
# ============================================================
# Ingress for Canary (Routes 10% of traffic to Canary Service)
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neurosight-ingress-canary
  namespace: neurosight-prod
  annotations:
    ingressClassName: nginx
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # WebSocket support
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.neurosight.ai
      secretName: neurosight-tls
  rules:
    - host: api.neurosight.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: neurosight-backend-canary
                port:
                  number: 8000
