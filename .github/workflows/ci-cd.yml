name: NeuroSight AI — CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/neurosight-ai

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Lint & Type-check
  # ============================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript type check
        working-directory: frontend
        run: npm run type-check

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python tools
        run: pip install ruff==0.11.9 mypy==1.16.0

      - name: Ruff lint (Python)
        working-directory: backend
        run: ruff check app/

      - name: Mypy type check
        working-directory: backend
        run: mypy app/ --ignore-missing-imports

  # ============================================================
  # Frontend Tests
  # ============================================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Run Vitest
        working-directory: frontend
        run: npm run test -- --reporter=verbose --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          directory: frontend/coverage
          flags: frontend

  # ============================================================
  # Backend Tests
  # ============================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-24.04
    needs: lint
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: neurosight_test
          POSTGRES_USER: neurosight
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg libgl1-mesa-glx

      - name: Install Python deps
        working-directory: backend
        run: |
          pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-minimum-32-chars-long
          JWT_SECRET_KEY: test-jwt-secret-minimum-32-chars-long
          POSTGRES_HOST: localhost
          POSTGRES_DB: neurosight_test
          POSTGRES_USER: neurosight
          POSTGRES_PASSWORD: test_password
          REDIS_HOST: localhost
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v \
            --asyncio-mode=auto \
            --timeout=60

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          file: backend/coverage.xml
          flags: backend

  # ============================================================
  # ML Model Tests
  # ============================================================
  test-ml:
    name: ML Model Tests
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ML deps
        run: |
          pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy scikit-learn pytest

      - name: Test model architectures
        run: |
          python -m pytest ml-models/ \
            -v \
            --timeout=120 \
            -k "not slow"

  # ============================================================
  # Security Scan
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    needs: [test-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.31.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Python dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969

  # ============================================================
  # Build & Push Docker Images
  # ============================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-24.04
    needs: [test-frontend, test-backend, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    outputs:
      frontend-tag: ${{ steps.meta-frontend.outputs.tags }}
      backend-tag: ${{ steps.meta-backend.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./infrastructure/docker/Dockerfile.frontend
          target: production
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.WS_URL }}

      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./infrastructure/docker/Dockerfile.backend
          target: production
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ============================================================
  # Deploy to Staging
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$PWD/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Update image tags
        run: |
          kubectl set image deployment/neurosight-frontend \
            frontend=${{ needs.build.outputs.frontend-tag }} \
            -n neurosight-staging

          kubectl set image deployment/neurosight-backend \
            backend=${{ needs.build.outputs.backend-tag }} \
            -n neurosight-staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/neurosight-frontend -n neurosight-staging --timeout=300s
          kubectl rollout status deployment/neurosight-backend -n neurosight-staging --timeout=300s

      - name: Run smoke tests
        run: |
          STAGING_URL=${{ vars.STAGING_URL }}
          curl -f "$STAGING_URL/health" || exit 1
          echo "✅ Staging deployment successful"

  # ============================================================
  # Deploy to Production
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Set kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG_PROD }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$PWD/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Blue-green deployment
        run: |
          # Patch the deployment with new image
          kubectl set image deployment/neurosight-frontend \
            frontend=${{ needs.build.outputs.frontend-tag }} \
            -n neurosight-prod --record

          kubectl set image deployment/neurosight-backend \
            backend=${{ needs.build.outputs.backend-tag }} \
            -n neurosight-prod --record

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/neurosight-frontend -n neurosight-prod --timeout=600s
          kubectl rollout status deployment/neurosight-backend -n neurosight-prod --timeout=600s

      - name: Production smoke test
        run: |
          curl -f "${{ vars.PROD_URL }}/health" || \
          (kubectl rollout undo deployment/neurosight-backend -n neurosight-prod && exit 1)

      - name: Notify deployment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment?.id || 0,
              state: 'success',
              description: 'Production deployment successful',
            })
